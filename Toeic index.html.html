<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>토익 입문 단어시험</title>
<style>
:root{--navy:#183153;--blue:#3567d4;--pale:#edf3ff;--green:#21875a;--red:#c84242;--ink:#202b3c;--muted:#718096;--line:#e3e9f2;--white:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;display:grid;place-items:center;background:linear-gradient(145deg,#f4f7ff,#eaf0fa);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{width:min(100%,560px);overflow:hidden;background:var(--white);border:1px solid #18315314;border-radius:24px;box-shadow:0 20px 60px #233b661f}header{padding:27px 30px 22px;background:var(--navy);color:#fff}.eyebrow{margin:0 0 8px;color:#c7d7ff;font-size:12px;font-weight:700;letter-spacing:.12em}h1{margin:0;font-size:clamp(23px,5vw,30px);letter-spacing:-.04em}.subtitle{margin:9px 0 0;color:#d8e2f5;font-size:14px;line-height:1.5}main{padding:26px 30px 30px}.label{margin:0 0 9px;color:var(--blue);font-size:13px;font-weight:800}.intro{margin:0 0 18px;color:var(--muted);font-size:14px;line-height:1.6}.mode-grid,.choices{display:grid;gap:10px}.mode-card{width:100%;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);text-align:left;font:inherit;cursor:pointer}.mode-card:hover,.mode-card:focus-visible,.choice:hover:not(:disabled){border-color:#9bb6f5;background:#f8faff}.mode-card strong{display:block;color:var(--navy);font-size:16px}.mode-card span{display:block;margin-top:5px;color:var(--muted);font-size:13px}.topline{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:13px;font-weight:700}.track{height:8px;overflow:hidden;margin-bottom:28px;background:#edf1f7;border-radius:999px}.fill{height:100%;background:var(--blue);border-radius:inherit;transition:width .2s}.word{margin:0;color:var(--navy);font-size:clamp(34px,9vw,46px);font-weight:800;letter-spacing:-.04em}.prompt{margin:8px 0 22px;color:var(--muted);font-size:14px}.choice{width:100%;min-height:54px;padding:12px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--ink);text-align:left;font:inherit;font-size:15px;cursor:pointer}.choice:disabled{cursor:default}.letter{width:27px;height:27px;flex:0 0 27px;display:grid;place-items:center;border-radius:8px;background:#f1f4f9;color:#64748b;font-size:12px;font-weight:800}.choice.correct{border-color:#71c69d;background:#f0fbf5;color:#176b43}.choice.wrong{border-color:#e5a1a1;background:#fff5f5;color:#a52f2f}.feedback{min-height:52px;margin-top:16px;padding:12px 14px;border-radius:12px;background:#f6f8fb;color:var(--muted);font-size:14px;line-height:1.5}.feedback:empty{visibility:hidden}.feedback.ok{background:#f0fbf5;color:#176b43}.feedback.no{background:#fff5f5;color:#a52f2f}.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}.action{min-height:46px;padding:0 20px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.action:disabled{background:#aab8d2;cursor:not-allowed}.action.secondary{background:var(--navy)}.result{text-align:center;padding:12px 0 4px}.badge{width:74px;height:74px;margin:0 auto 18px;display:grid;place-items:center;border-radius:24px;background:var(--pale);font-size:34px}.result h2{margin:0;color:var(--navy);font-size:27px}.score{margin:12px 0 8px;color:var(--blue);font-size:40px;font-weight:900}.message{margin:0 auto 20px;max-width:360px;color:var(--muted);font-size:15px;line-height:1.6}.result .actions{justify-content:center}@media(max-width:480px){body{padding:12px}.app{border-radius:19px}header{padding:24px 22px 20px}main{padding:22px}}
</style>
</head>
<body><div class="app"><header><p class="eyebrow">TOEIC VOCABULARY · BEGINNER</p><h1>토익 입문 단어시험</h1><p class="subtitle">기초 단어부터 가볍게 시작해 보세요.</p></header><main id="quiz" aria-live="polite"></main></div>
<script>
const vocabularyByMode={
쉬움:[
{word:"schedule",meaning:"일정, 스케줄"},{word:"meeting",meaning:"회의"},{word:"customer",meaning:"고객"},{word:"office",meaning:"사무실"},{word:"employee",meaning:"직원"},{word:"price",meaning:"가격"},{word:"order",meaning:"주문하다, 주문"},{word:"travel",meaning:"여행하다, 여행"},{word:"arrive",meaning:"도착하다"},{word:"report",meaning:"보고서, 보고하다"},{word:"available",meaning:"이용 가능한, 시간이 되는"},{word:"business",meaning:"사업, 업무"},{word:"invite",meaning:"초대하다"},{word:"message",meaning:"메시지, 전갈"},{word:"finish",meaning:"끝내다, 마치다"},{word:"email",meaning:"이메일"},{word:"help",meaning:"돕다, 도움"},{word:"call",meaning:"전화하다, 전화"},{word:"open",meaning:"열다, 열린"},{word:"close",meaning:"닫다, 가까운"}],
보통:[
{word:"confirm",meaning:"확인하다"},{word:"postpone",meaning:"연기하다"},{word:"attend",meaning:"참석하다"},{word:"arrange",meaning:"준비하다, 정리하다"},{word:"purchase",meaning:"구매하다, 구매"},{word:"receive",meaning:"받다"},{word:"deliver",meaning:"배달하다, 전달하다"},{word:"provide",meaning:"제공하다"},{word:"require",meaning:"요구하다, 필요로 하다"},{word:"review",meaning:"검토하다, 검토"},{word:"approve",meaning:"승인하다"},{word:"discuss",meaning:"논의하다"},{word:"reserve",meaning:"예약하다, 비축하다"},{word:"complete",meaning:"완료하다, 완전한"},{word:"increase",meaning:"증가하다, 증가시키다"},{word:"reduce",meaning:"줄이다, 감소하다"},{word:"inform",meaning:"알리다"},{word:"contact",meaning:"연락하다, 연락처"},{word:"decide",meaning:"결정하다"},{word:"repair",meaning:"수리하다, 수리"}],
어려움:[
{word:"accommodate",meaning:"수용하다, 편의를 제공하다"},{word:"itinerary",meaning:"여행 일정표"},{word:"invoice",meaning:"송장, 청구서"},{word:"expenditure",meaning:"지출, 경비"},{word:"reimburse",meaning:"변제하다, 환급하다"},{word:"mandatory",meaning:"의무적인, 필수의"},{word:"tentative",meaning:"잠정적인, 임시의"},{word:"eligible",meaning:"자격이 있는"},{word:"comply",meaning:"준수하다"},{word:"discrepancy",meaning:"차이, 불일치"},{word:"implement",meaning:"시행하다, 실행하다"},{word:"retain",meaning:"보유하다, 유지하다"},{word:"merchandise",meaning:"상품"},{word:"inventory",meaning:"재고, 재고 목록"},{word:"correspondence",meaning:"서신, 연락"},{word:"negotiate",meaning:"협상하다"},{word:"confidential",meaning:"기밀의, 비밀의"},{word:"promptly",meaning:"즉시, 신속하게"},{word:"designate",meaning:"지정하다, 임명하다"},{word:"venue",meaning:"행사 장소"}]
};
const quiz=document.getElementById('quiz'),letters=['A','B','C','D'];let questions=[],currentIndex=0,score=0,answered=false,selectedMode='쉬움';
function shuffle(items){const copy=[...items];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
function renderModeSelection(){quiz.innerHTML='<p class="label">난이도를 선택하세요</p><p class="intro">각 모드마다 20문제가 출제됩니다. 영어 단어를 보고 알맞은 한국어 뜻을 골라보세요.</p><div class="mode-grid"><button class="mode-card" data-mode="쉬움"><strong>쉬움</strong><span>기초 토익 단어 · 20문제</span></button><button class="mode-card" data-mode="보통"><strong>보통</strong><span>업무·일정 관련 단어 · 20문제</span></button><button class="mode-card" data-mode="어려움"><strong>어려움</strong><span>토익 빈출 고급 단어 · 20문제</span></button></div>';quiz.querySelectorAll('.mode-card').forEach(b=>b.addEventListener('click',()=>startQuiz(b.dataset.mode)))}
function startQuiz(mode){selectedMode=mode;questions=shuffle(vocabularyByMode[mode]).map(item=>{const wrong=shuffle(vocabularyByMode[mode].filter(x=>x.word!==item.word)).slice(0,3).map(x=>x.meaning);return{...item,options:shuffle([item.meaning,...wrong])}});currentIndex=0;score=0;answered=false;renderQuestion()}
function renderQuestion(){answered=false;const q=questions[currentIndex],progress=currentIndex/questions.length*100;quiz.innerHTML=`<div class="topline"><span>${selectedMode} 모드 · 문제 ${currentIndex+1} / ${questions.length}</span><span>현재 점수 ${score}점</span></div><div class="track" role="progressbar" aria-label="시험 진행 상황" aria-valuenow="${currentIndex}" aria-valuemin="0" aria-valuemax="${questions.length}"><div class="fill" style="width:${progress}%"></div></div><p class="label">다음 영어 단어의 뜻은 무엇일까요?</p><h2 class="word">${q.word}</h2><p class="prompt">가장 알맞은 한국어 뜻을 선택하세요.</p><div class="choices">${q.options.map((o,i)=>`<button class="choice" data-answer="${o}"><span class="letter">${letters[i]}</span><span>${o}</span></button>`).join('')}</div><div class="feedback" id="feedback" role="status" aria-live="polite"></div><div class="actions"><button class="action" id="nextButton" disabled>${currentIndex===questions.length-1?'결과 보기':'다음 문제'}</button></div>`;quiz.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>selectAnswer(b,q)));document.getElementById('nextButton').addEventListener('click',()=>{if(!answered)return;currentIndex++;if(currentIndex>=questions.length)renderResult();else renderQuestion()})}
function selectAnswer(button,q){if(answered)return;answered=true;const correct=button.dataset.answer===q.meaning,feedback=document.getElementById('feedback');quiz.querySelectorAll('.choice').forEach(b=>{b.disabled=true;if(b.dataset.answer===q.meaning)b.classList.add('correct')});if(correct){score++;feedback.textContent='정답이에요! 잘했어요.';feedback.classList.add('ok')}else{button.classList.add('wrong');feedback.textContent=`아쉬워요. 정답은 “${q.meaning}”입니다.`;feedback.classList.add('no')}quiz.querySelector('.topline span:last-child').textContent=`현재 점수 ${score}점`;quiz.querySelector('.fill').style.width=`${(currentIndex+1)/questions.length*100}%`;document.getElementById('nextButton').disabled=false}
function renderResult(){const percent=Math.round(score/questions.length*100),message=percent===100?'완벽해요! 선택한 난이도의 단어를 모두 알고 있네요.':percent>=70?'좋은 결과예요. 틀린 단어를 다시 확인해 보세요.':'괜찮아요. 단어를 복습한 뒤 다시 도전해 보세요.';quiz.innerHTML=`<section class="result"><div class="badge" aria-hidden="true">${percent>=70?'🎉':'📘'}</div><p class="label">${selectedMode} 모드 · 시험 완료</p><h2>수고했어요!</h2><p class="score">${score}<span style="font-size:20px;color:#718096"> / ${questions.length}점</span></p><p class="message">${message}</p><div class="actions"><button class="action secondary" id="modeButton">난이도 선택</button><button class="action" id="retryButton">다시 풀기</button></div></section>`;document.getElementById('retryButton').addEventListener('click',()=>startQuiz(selectedMode));document.getElementById('modeButton').addEventListener('click',renderModeSelection)}
renderModeSelection();
</script></body></html>
